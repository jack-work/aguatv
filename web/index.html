<!DOCTYPE html>
<html lang="en" data-scheme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#1a0d0f">
<title>aguatv</title>
<link rel="stylesheet" href="home.css">
</head>
<body class="gesso-stage">
<!-- zanni:boil -->
<!-- zanni:gesso -->
<!-- zanni:phosphor -->
<!-- zanni:fontpack -->
<!-- zanni:filo -->

<main class="stage phosphor-host phosphor-soft">
  <header class="masthead">
    <h1 class="mark fontpack-display boil-text-squiggle">aguatv</h1>
    <div class="here fontpack-mono" id="here"></div>
    <input class="search fontpack-mono" id="search" type="search" placeholder="search titles, paths, tags" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="search">
    <div class="when">
      <div id="clock" class="clock fontpack-display boil-text"></div>
      <div id="date" class="date fontpack-mono"></div>
    </div>
  </header>

  <section class="shelf" id="shelf"></section>
  <section class="canvas" id="canvas"></section>

  <footer class="hint fontpack-mono" id="hint"></footer>
  <aside class="drawer" id="drawer"></aside>
</main>

<section class="pad-sheet" id="pad" hidden>
  <header class="pad-top">
    <div class="pad-title fontpack-display boil-text-squiggle" id="padTitle"></div>
    <button data-details class="small for-screen">details</button>
    <button data-close class="small">close</button>
  </header>
  <div class="now for-screen" id="now">
    <div class="now-title fontpack-prose boil-text" id="nowTitle">nothing playing</div>
    <div class="now-track" id="nowTrack"><div class="now-fill" id="nowFill"></div></div>
    <div class="now-times fontpack-mono"><span id="nowPos">0:00</span><span id="nowLeft"></span></div>
  </div>
  <div class="row three for-adb">
    <button data-a="power" class="small">power</button>
    <button data-a="settings" class="small">aguatv</button>
    <button data-a="tvsettings" class="small">TV set.</button>
  </div>
  <div class="pad" aria-label="direction pad">
    <button data-a="up" class="up" aria-label="up">▲</button>
    <button data-a="left" class="left" aria-label="left">◀</button>
    <button data-a="ok" class="ok fontpack-display boil-text">OK</button>
    <button data-a="right" class="right" aria-label="right">▶</button>
    <button data-a="down" class="down" aria-label="down">▼</button>
  </div>
  <div class="row three">
    <button data-a="back" class="boil-text">back</button>
    <button data-a="home" class="for-adb boil-text">home</button>
    <button data-a="stop" class="for-screen boil-text">stop</button>
    <button data-a="menu" class="for-adb boil-text">details</button>
    <button data-a="bar" class="for-screen boil-text">bar</button>
  </div>
  <div class="row three">
    <button data-a="rewind" aria-label="back 30 seconds">◀◀</button>
    <button data-a="play" aria-label="play or pause">▶‖</button>
    <button data-a="forward" aria-label="forward 30 seconds">▶▶</button>
  </div>
  <div class="row three for-adb">
    <button data-a="voldown" class="boil-text">vol −</button>
    <button data-a="mute" class="boil-text">mute</button>
    <button data-a="volup" class="boil-text">vol +</button>
  </div>
  <form class="field for-adb" id="padText">
    <input class="fontpack-mono" placeholder="type on the TV" autocomplete="off" autocapitalize="off" spellcheck="false">
    <button type="submit" class="boil-text">send</button>
  </form>
  <form class="field for-screen" id="padCast">
    <input class="fontpack-mono" placeholder="a files path to cast" autocomplete="off" autocapitalize="off" spellcheck="false">
    <button type="submit" class="boil-text">cast</button>
  </form>
  <div class="pad-status fontpack-mono" id="padStatus"></div>
</section>

<section class="cast" id="cast" data-filo hidden>
  <video id="video" playsinline preload="metadata"></video>
</section>

<svg class="witness" width="0" height="0" aria-hidden="true">
  <g class="boil-slack"></g><g class="boil-text"></g>
  <g class="boil-text-fine"></g><g class="boil-text-strong"></g><g class="boil-text-erode"></g>
  <g class="boil-ui"></g><g class="boil-ui-squiggle"></g><g class="boil-ui-fine"></g>
  <g class="boil-ui-strong"></g><g class="boil-ui-erode"></g>
  <g class="boil-stage"></g><g class="boil-stage-squiggle"></g><g class="boil-stage-fine"></g>
  <g class="boil-stage-strong"></g><g class="boil-stage-erode"></g>
  <g class="gesso"></g><g class="fontpack-prose"></g><g class="phosphor"></g>
</svg>

<script src="cast.js"></script>
<script src="home.js"></script>
</body>
</html>
