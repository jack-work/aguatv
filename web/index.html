<!DOCTYPE html>
<html lang="en" data-scheme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#1a0d0f">
<title>aguatv</title>
<link rel="stylesheet" href="home.css">
</head>
<body class="gesso-stage">
<!-- zanni:boil -->
<!-- zanni:gesso -->
<!-- zanni:phosphor -->
<!-- zanni:fontpack -->
<!-- zanni:filo -->

<main class="stage phosphor-host phosphor-soft">
  <header class="masthead">
    <h1 class="mark fontpack-display boil-text-squiggle">aguatv</h1>
    <div class="here fontpack-mono" id="here"></div>
    <div class="when">
      <div id="clock" class="clock fontpack-display boil-text"></div>
      <div id="date" class="date fontpack-mono"></div>
    </div>
  </header>

  <section class="shelf" id="shelf"></section>
  <section class="canvas" id="canvas"></section>

  <footer class="hint fontpack-mono" id="hint"></footer>
  <aside class="drawer" id="drawer"></aside>
</main>

<section class="pad-sheet" id="pad" hidden>
  <header class="pad-top">
    <div class="pad-title fontpack-display" id="padTitle"></div>
    <button data-close class="small">close</button>
  </header>
  <div class="row three">
    <button data-a="power" class="small">power</button>
    <button data-a="settings" class="small">aguatv</button>
    <button data-a="tvsettings" class="small">TV set.</button>
  </div>
  <div class="pad" aria-label="direction pad">
    <button data-a="up" class="up" aria-label="up">▲</button>
    <button data-a="left" class="left" aria-label="left">◀</button>
    <button data-a="ok" class="ok fontpack-display">OK</button>
    <button data-a="right" class="right" aria-label="right">▶</button>
    <button data-a="down" class="down" aria-label="down">▼</button>
  </div>
  <div class="row three">
    <button data-a="back">back</button>
    <button data-a="home">home</button>
    <button data-a="menu">details</button>
  </div>
  <div class="row three">
    <button data-a="rewind" aria-label="rewind">◀◀</button>
    <button data-a="play" aria-label="play or pause">▶‖</button>
    <button data-a="forward" aria-label="fast forward">▶▶</button>
  </div>
  <div class="row three">
    <button data-a="voldown">vol −</button>
    <button data-a="mute">mute</button>
    <button data-a="volup">vol +</button>
  </div>
  <form class="field" id="padText">
    <input class="fontpack-mono" placeholder="type on the TV" autocomplete="off" autocapitalize="off" spellcheck="false">
    <button type="submit">send</button>
  </form>
  <div class="pad-status fontpack-mono" id="padStatus">h j k l, enter, b back, gg home, i to type, esc to close</div>
</section>

<section class="cast" id="cast" hidden>
  <video id="video" playsinline preload="metadata"></video>
  <div class="cast-bar" id="castBar"></div>
</section>

<svg class="witness" width="0" height="0" aria-hidden="true">
  <g class="boil-slack"></g><g class="boil-text"></g>
  <g class="boil-text-fine"></g><g class="boil-text-strong"></g><g class="boil-text-erode"></g>
  <g class="boil-ui"></g><g class="boil-ui-squiggle"></g><g class="boil-ui-fine"></g>
  <g class="boil-ui-strong"></g><g class="boil-ui-erode"></g>
  <g class="boil-stage"></g><g class="boil-stage-squiggle"></g><g class="boil-stage-fine"></g>
  <g class="boil-stage-strong"></g><g class="boil-stage-erode"></g>
  <g class="gesso"></g><g class="fontpack-prose"></g><g class="phosphor"></g>
</svg>

<script src="cast.js"></script>
<script src="home.js"></script>
</body>
</html>
