<!DOCTYPE html>
<html lang="en" data-scheme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#1a0d0f">
<title>aguatv</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="aguatv.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="aguatv">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="stylesheet" href="home.css">
</head>
<body class="gesso-stage">
<!-- zanni:boil -->
<!-- zanni:gesso -->
<!-- zanni:phosphor -->
<!-- zanni:fontpack -->
<!-- zanni:filo -->
<!-- zanni:bacchetta -->

<main class="stage phosphor-host phosphor-soft">
  <header class="masthead">
    <h1 class="mark fontpack-display boil-text-squiggle">aguatv</h1>
    <div class="here fontpack-mono" id="here"></div>
    <input class="search fontpack-mono" id="search" type="search" placeholder="search titles, paths, tags" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="search">
    <div class="when">
      <div id="clock" class="clock fontpack-display boil-text"></div>
      <div id="date" class="date fontpack-mono"></div>
    </div>
  </header>

  <section class="shelf" id="shelf"></section>
  <section class="canvas" id="canvas"></section>

  <footer class="hint fontpack-mono" id="hint"></footer>
  <aside class="drawer" id="drawer"></aside>
</main>


<div class="caster-slot"><button class="caster" id="caster" type="button">cast</button></div>

<section class="cast" id="cast" data-filo hidden>
  <video id="video" playsinline preload="metadata"></video>
  <div class="cast-note fontpack-display" id="castNote" hidden></div>
</section>

<section class="details" id="details" hidden></section>

<svg class="witness" width="0" height="0" aria-hidden="true">
  <g class="boil-slack"></g><g class="boil-text"></g>
  <g class="boil-text-fine"></g><g class="boil-text-strong"></g><g class="boil-text-erode"></g>
  <g class="boil-ui"></g><g class="boil-ui-squiggle"></g><g class="boil-ui-fine"></g>
  <g class="boil-ui-strong"></g><g class="boil-ui-erode"></g>
  <g class="boil-stage"></g><g class="boil-stage-squiggle"></g><g class="boil-stage-fine"></g>
  <g class="boil-stage-strong"></g><g class="boil-stage-erode"></g>
  <g class="gesso"></g><g class="fontpack-prose"></g><g class="phosphor"></g>
</svg>

<script src="cast.js"></script>
<script src="home.js"></script>
</body>
</html>
